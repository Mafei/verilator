  rocky8:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      core_review: ${{ steps.producer_review.outputs.core_review }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false
      - name: Build in Rocky Linux 8.10
        run: |
          docker pull rockylinux/rockylinux:8.10@sha256:f5529992e67440c1a4ae7788244d4381c6909159a88eacd95b7523ae47ced82e
          docker image inspect rockylinux/rockylinux:8.10@sha256:f5529992e67440c1a4ae7788244d4381c6909159a88eacd95b7523ae47ced82e --format '{{json .RepoDigests}}' > rocky-image.txt
          docker run --rm -e GITHUB_ACTIONS=true -e CC=gcc -e CXX=g++ \
            -e ARTIFACT_UID="$(id -u)" -e ARTIFACT_GID="$(id -g)" \
            -v "$PWD:/work" -w /work rockylinux/rockylinux:8.10@sha256:f5529992e67440c1a4ae7788244d4381c6909159a88eacd95b7523ae47ced82e bash -c '
              set -e
              dnf -y install dnf-plugins-core
              dnf config-manager --set-enabled powertools
              dnf -y install gcc-toolset-13-gcc-c++ gcc-toolset-13-binutils gcc-toolset-13-libstdc++-devel \
                gcc-toolset-13-libasan-devel \
                autoconf automake make perl git curl tar gzip xz findutils diffutils \
                python3.11 python3.11-pip zlib-devel lz4-devel help2man util-linux
              ln -s /usr/bin/python3.11 /usr/local/bin/python3
              source /opt/rh/gcc-toolset-13/enable
              asan_probe_directory=$(mktemp -d /tmp/verilator-asan-probe.XXXXXX)
              printf "%s\n" "int main() { int* value = new int[1]; value[0] = 13; int result = value[0] - 13; delete[] value; return result; }" \
                | g++ -fsanitize=address -x c++ - -o "$asan_probe_directory/probe"
              "$asan_probe_directory/probe"
              rpm -q gcc-toolset-13-libasan-devel libasan8
              rpm -q --requires gcc-toolset-13-libasan-devel
              g++ -print-file-name=libasan_preinit.o
              g++ -print-file-name=libasan.so
              ldd "$asan_probe_directory/probe"
              sha256sum "$asan_probe_directory/probe"
              printf "ASAN_TOOLSET13_PREFLIGHT_PASSED\n"
              # Run repository work as the mounted checkout owner.
              setpriv --reuid "$ARTIFACT_UID" --regid "$ARTIFACT_GID" --clear-groups \
                bash -c "
                  set -euo pipefail
                  portable_owner_home=\$(mktemp -d /tmp/verilator-owner-home.XXXXXX)
                  exec env HOME=\"\$portable_owner_home\" \"\$@\"
                " portable-owner bash ci/portable/build.bash rocky8-x86_64
            '
      - name: Verify package in a fresh Rocky 8.10 container
        if: ${{ !cancelled() && hashFiles('out/verilator-fourstate-rocky8-x86_64.tar.gz') != '' }}
        run: |
          docker run --rm -e GITHUB_ACTIONS=true -v "$PWD:/source:ro" rockylinux/rockylinux:8.10@sha256:f5529992e67440c1a4ae7788244d4381c6909159a88eacd95b7523ae47ced82e bash -c '
            set -e
            dnf -y install gcc-toolset-13-gcc-c++ gcc-toolset-13-binutils make perl python3.11 tar gzip
            source /opt/rh/gcc-toolset-13/enable
            ln -s /usr/bin/python3.11 /usr/local/bin/python3
            mkdir -p /tmp/relocated
            tar xzf /source/out/verilator-fourstate-rocky8-x86_64.tar.gz -C /tmp/relocated
            cd /tmp
            python3 /source/ci/portable/smoke.py /tmp/relocated/verilator-fourstate/bin/verilator /tmp/model
          '
      - name: Run pinned Icarus defaults and fixed 128 pair in Rocky 8.10
        if: ${{ !cancelled() && hashFiles('bin/verilator_bin') != '' }}
        run: |
          icarus_expected_head=$(git rev-parse HEAD)
          docker run --rm -e GITHUB_ACTIONS=true -e CC=gcc -e CXX=g++ \
            -e ARTIFACT_UID="$(id -u)" -e ARTIFACT_GID="$(id -g)" \
            -e ICARUS_EXPECTED_SHA="$icarus_expected_head" \
            -v "$PWD:/work" -w /work rockylinux/rockylinux:8.10@sha256:f5529992e67440c1a4ae7788244d4381c6909159a88eacd95b7523ae47ced82e bash -c '
              set -e
              dnf -y install dnf-plugins-core
              dnf config-manager --set-enabled powertools
              dnf -y install gcc-toolset-13-gcc-c++ gcc-toolset-13-binutils gcc-toolset-13-libstdc++-devel \
                autoconf make perl git gperf python3.11 zlib-devel bzip2-devel util-linux
              ln -s /usr/bin/python3.11 /usr/local/bin/python3
              source /opt/rh/gcc-toolset-13/enable
              source .ci-venv/bin/activate
              export PATH="/work/.ci-tools/bin:$PATH"
              export CPPFLAGS="-I/work/.ci-tools/include"
              # Run Git and the models as the mounted checkout owner.
              setpriv --reuid "$ARTIFACT_UID" --regid "$ARTIFACT_GID" --clear-groups \
                bash -c "
                  set -euo pipefail
                  portable_owner_home=\$(mktemp -d /tmp/verilator-owner-home.XXXXXX)
                  exec env HOME=\"\$portable_owner_home\" \"\$@\"
                " portable-owner \
                python3 ci/portable/run_icarus_sweep.py --platform rocky8-x86_64 \
                --verilator-root /work --expected-verilator-sha "$ICARUS_EXPECTED_SHA" \
                --jobs 2 --output pinned-icarus
            '
      - name: Print original fixed128 case evidence
        if: ${{ !cancelled() && hashFiles('pinned-icarus/pair/results.json') != '' }}
        run: |
          python3 ci/portable/print_fixed128_logs.py \
            --pair pinned-icarus/pair --source pinned-icarus/source \
            --inventory pinned-icarus/inventory/core-inventory.json \
            --select pinned-icarus/inventory/first128-runtime-structural.json \
            --expected-head "$(git rev-parse HEAD)"
      - name: Independently verify recorded results

name: Portable four-state builds
on:
  push:
    branches: [fourstate-portable, fourstate-upstream-20261008, fourstate-sv-20261008, fourstate-readmem-20261008, fourstate-nba-20261008, fourstate-pull-20261008, fourstate-resolve-20261008, fourstate-amd-repair-20261008, fourstate-followup-20261009, fourstate-icarus-lint-20261009, fourstate-finish-slice-20261009, fourstate-final-local-20261009, fourstate-plusargs-20261009, fourstate-finish-boundaries-20261009, fourstate-sync-20261010, fourstate-icarus-semantics-20261010, fourstate-sync-20261011, fourstate-strict-fix-20261011, fourstate-finish-boundary-20261011, fourstate-sv-controls-20261011, fourstate-sync-20261013, fourstate-sync-20261014, fourstate-sync-20261014-followup, fourstate-sync-20261015, fourstate-sync-20261017, fourstate-sv-icarus-20261026, fourstate-sv-icarus-20261026-public, fourstate-real-dynamic-format-20261027, fourstate-ancestor-context-20261027-public, fourstate-context-integration-20261027, fourstate-upstream-context-20261027, fourstate-output-port-alias-20261027, fourstate-upstream-output-20261027, fourstate-finish-coverage-20261027-public, fourstate-upstream-subst-20261027, fourstate-upstream-20261028, fourstate-purity-20261028, fourstate-purity-command-20261028, fourstate-select-guard-20261028, fourstate-lambda-int-20261028]
  pull_request:
    branches: [dev/fourstate, fourstate-portable, fourstate-upstream-20261008, fourstate-sv-20261008, fourstate-readmem-20261008, fourstate-nba-20261008, fourstate-pull-20261008, fourstate-resolve-20261008, fourstate-amd-repair-20261008]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  artifact-review:
    needs: [macos, rocky8]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          set-safe-directory: false
      - name: Summarize typed producer checks without downloading artifacts
        if: ${{ always() && !cancelled() }}
        env:
          MACOS_CORE_REVIEW: ${{ needs.macos.outputs.core_review }}
          ROCKY8_CORE_REVIEW: ${{ needs.rocky8.outputs.core_review }}
          MACOS_JOB_RESULT: ${{ needs.macos.result }}
          ROCKY8_JOB_RESULT: ${{ needs.rocky8.result }}
        run: |
          python3 ci/portable/review_artifacts.py summarize \
            --expected-head "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" \
            --output artifact-core-review.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portable-core-review-${{ github.run_id }}
          path: artifact-core-review.json
          if-no-files-found: error
  macos:
    runs-on: macos-26
    timeout-minutes: 150
    outputs:
      core_review: ${{ steps.producer_review.outputs.core_review }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false
      - name: Install build tools on the cloud runner
        run: brew install autoconf automake bzip2 gperf help2man lz4 make zlib
      - name: Build, check dependencies, relocate, and run regressions
        run: bash ci/portable/build.bash macos-arm64
      - name: Run pinned Icarus defaults and fixed 128 pair
        if: ${{ !cancelled() && hashFiles('bin/verilator_bin') != '' }}
        run: |
          source .ci-venv/bin/activate
          export PATH="$PWD/.ci-tools/bin:$PATH"
          export CPPFLAGS="-I$PWD/.ci-tools/include -I$(brew --prefix zlib)/include"
          export LDFLAGS="-L$(brew --prefix zlib)/lib"
          python3 ci/portable/run_icarus_sweep.py --platform macos-arm64 \
            --verilator-root "$PWD" --expected-verilator-sha "$(git rev-parse HEAD)" \
            --bzip2-prefix "$(brew --prefix bzip2)" --jobs 2 --output pinned-icarus
      - name: Print original fixed128 case evidence
        if: ${{ !cancelled() && hashFiles('pinned-icarus/pair/results.json') != '' }}
        run: |
          python3 ci/portable/print_fixed128_logs.py \
            --pair pinned-icarus/pair --source pinned-icarus/source \
            --inventory pinned-icarus/inventory/core-inventory.json \
            --select pinned-icarus/inventory/first128-runtime-structural.json \
            --expected-head "$(git rev-parse HEAD)"
      - name: Independently verify recorded results
        if: ${{ !cancelled() && hashFiles('out/regression-results.json') != '' }}
        run: python3 ci/portable/check_results.py
      - name: Check local producer files before upload without running models
        id: producer_review
        if: ${{ always() && !cancelled() }}
        env:
          PRODUCER_PRIOR_RESULT: ${{ job.status }}
        run: |
          python3 ci/portable/review_artifacts.py producer \
            --expected-head "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" \
            --platform macos-arm64 --producer-root "$(pwd -P)" \
            --prior-result "$PRODUCER_PRIOR_RESULT" --output out/producer-core-review.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-arm64-${{ github.run_id }}
          path: |
            out/
            logs/
            test_regress/obj_vlt/*/*.log
            test_regress/obj_vlt/*/*.status
            test_regress/obj_vlt/t_debug_emitv/*_width.tree.v
            test_regress/obj_vltmt/t_fourstate_sen_hierarchy/*.log
